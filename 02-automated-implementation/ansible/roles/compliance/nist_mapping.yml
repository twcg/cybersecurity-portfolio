# nist_mapping.yml
nist_800_53_controls:
  AC-2:  # Account Management
    cis_controls:
      - "5.4.1.4 Ensure password expiration warning days is 7 or more"
      - "5.4.1.5 Ensure system accounts are non-login"
    implementation: "roles/cis_ubuntu/tasks/account_management.yml"
    automated: true
    
  AC-3:  # Access Enforcement
    cis_controls:
      - "5.2.1 Ensure permissions on /etc/ssh/sshd_config are configured"
      - "5.2.2 Ensure permissions on SSH private host key files are configured"
    implementation: "roles/cis_ubuntu/tasks/ssh_hardening.yml"
    automated: true
    
  AU-3:  # Content of Audit Records
    cis_controls:
      - "4.1.3 Ensure auditing for processes that start prior to auditd is enabled"
      - "4.1.4 Ensure audit_backlog_limit is sufficient"
    implementation: "roles/cis_ubuntu/tasks/auditd_config.yml"
    automated: true
    
  CM-6:  # Configuration Settings
    cis_controls:
      - "All CIS Benchmark controls"
    implementation: "Entire hardening framework"
    automated: true
    
  IA-2:  # Identification and Authentication
    cis_controls:
      - "5.3.1 Ensure password creation requirements are configured"
      - "5.3.2 Ensure lockout for failed password attempts is configured"
    implementation: "roles/cis_ubuntu/tasks/password_policies.yml"
    automated: true
    
  SC-28:  # Protection of Information at Rest
    cis_controls:
      - "1.4.1 Ensure permissions on bootloader config are configured"
    implementation: "roles/cis_ubuntu/tasks/filesystem_security.yml"
    automated: true